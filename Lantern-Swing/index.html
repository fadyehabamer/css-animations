<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Ramadan fanous built from CSS shapes, swinging on its chain with a flickering glow.">
  <title>Lantern Swing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="lantern" role="img" aria-label="A Ramadan lantern swinging on a chain">
      <span class="chain"></span>
      <span class="ring"></span>
      <span class="cap"></span>
      <span class="body">
        <span class="window"></span>
        <span class="window"></span>
        <span class="window"></span>
        <span class="flame"></span>
      </span>
      <span class="base"></span>
      <span class="tip"></span>
    </div>
    <p class="greeting" lang="ar" dir="rtl">رمضان كريم</p>
    <a class="back" href="../">More animations</a>
  </main>
</body>
</html>
